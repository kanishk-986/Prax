<!doctype html>
<!-- LinkedIn-like profile activity and search results: posts in list items with no post class at all,
     next to people cards (Connect, Message) that are not posts. Written by hand for the Prax bar tests;
     not saved from linkedin.com. -->
<html><head><meta charset="utf-8"><title>Search | LinkedIn</title></head>
<body>
<main>
  <ul class="reusable-search__entity-result-list">
    <li class="r1">
      <div><a href="/in/nadia-karim/"><span>Nadia Karim</span></a><span>COO, PayRail</span></div>
      <button><span>Connect</span></button><button><span>Message</span></button>
    </li>
    <li class="r1">
      <div><div><a href="/in/nadia-karim/"><span>Nadia Karim</span></a></div>
        <div class="update-components-text"><span>Interoperability between wallets is the real moat in GCC payments.</span></div>
        <div><a href="/feed/update/urn:li:share:7390000000000000031/">3d</a></div>
        <div class="bar"><div class="grp">
          <button aria-label="React Like"><span>Like</span></button>
          <button aria-label="Comment"><span>Comment</span></button>
          <button aria-label="Repost"><span>Repost</span></button>
        </div></div>
      </div>
    </li>
    <li class="r1">
      <div><div><a href="/in/nadia-karim/"><span>Nadia Karim</span></a></div>
        <div class="update-components-text"><span>Second post in the same list.</span></div>
        <div><a href="/feed/update/urn:li:ugcPost:7390000000000000032/">5d</a></div>
        <div class="bar"><div class="grp">
          <button aria-label="React Like"><span>Like</span></button>
          <button aria-label="Comment"><span>Comment</span></button>
          <button aria-label="Repost"><span>Repost</span></button>
        </div></div>
      </div>
    </li>
  </ul>
</main>
</body></html>
